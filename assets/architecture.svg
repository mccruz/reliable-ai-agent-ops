<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Reliable AI Agent Ops architecture</title>
  <desc id="desc">A fictional AI-agent service flows through health checks and atomic backup, then a network-disabled restore verifier, typed evidence receipts, and a final human review gate.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#63d8ff"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#background)"/>
  <text x="72" y="86" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="700">Evidence-first AI agent operations</text>
  <text x="72" y="124" fill="#9fb3c8" font-family="Inter,Arial,sans-serif" font-size="20">Synthetic services · no credentials · no automatic production action</text>

  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <rect x="72" y="195" width="220" height="142" rx="18" fill="#12385b" stroke="#2e78aa" stroke-width="2"/>
    <circle cx="112" cy="239" r="13" fill="#3ddc97"/>
    <text x="140" y="247" fill="#f8fafc" font-size="23" font-weight="700">Synthetic agent</text>
    <text x="98" y="286" fill="#b9cad9" font-size="17">JSON health contract</text>
    <text x="98" y="314" fill="#b9cad9" font-size="17">Fictional state only</text>

    <rect x="354" y="172" width="226" height="92" rx="18" fill="#12385b" stroke="#2e78aa" stroke-width="2"/>
    <text x="382" y="211" fill="#f8fafc" font-size="21" font-weight="700">Health evidence</text>
    <text x="382" y="239" fill="#b9cad9" font-size="16">Fault-isolated probes</text>

    <rect x="354" y="287" width="226" height="92" rx="18" fill="#12385b" stroke="#2e78aa" stroke-width="2"/>
    <text x="382" y="326" fill="#f8fafc" font-size="21" font-weight="700">Atomic backup</text>
    <text x="382" y="354" fill="#b9cad9" font-size="16">Lock · manifest · SHA-256</text>

    <rect x="650" y="195" width="290" height="142" rx="18" fill="#183c45" stroke="#35c69a" stroke-width="2"/>
    <path d="M697 237v28c0 21 15 37 33 42 18-5 33-21 33-42v-28l-33-13z" fill="none" stroke="#5ee0b5" stroke-width="4"/>
    <path d="M714 264l11 11 22-25" fill="none" stroke="#5ee0b5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="785" y="247" fill="#f8fafc" font-size="21" font-weight="700">Verified restore</text>
    <text x="785" y="278" fill="#c1e9dc" font-size="16">Network: none</text>
    <text x="785" y="304" fill="#c1e9dc" font-size="16">Ephemeral volume</text>

    <rect x="650" y="402" width="290" height="112" rx="18" fill="#12385b" stroke="#2e78aa" stroke-width="2"/>
    <text x="681" y="444" fill="#f8fafc" font-size="21" font-weight="700">Typed receipts</text>
    <text x="681" y="476" fill="#b9cad9" font-size="16">Freshness · digests · links</text>

    <rect x="956" y="305" width="182" height="146" rx="18" fill="#3a2d16" stroke="#f3b343" stroke-width="2"/>
    <circle cx="1047" cy="348" r="19" fill="none" stroke="#ffd166" stroke-width="4"/>
    <path d="M1018 405c9-24 49-24 58 0" fill="none" stroke="#ffd166" stroke-width="4" stroke-linecap="round"/>
    <text x="991" y="433" fill="#fef3c7" font-size="20" font-weight="700">Human review</text>
  </g>

  <g fill="none" stroke="#63d8ff" stroke-width="4" marker-end="url(#arrow)">
    <path d="M292 231 C318 231 327 218 354 218"/>
    <path d="M292 301 C318 301 327 333 354 333"/>
    <path d="M580 333 C615 333 617 266 650 266"/>
    <path d="M580 218 C617 218 611 438 650 438"/>
    <path d="M769 337 L769 402"/>
    <path d="M940 458 C955 458 941 378 956 378"/>
  </g>

  <rect x="72" y="565" width="1066" height="56" rx="14" fill="#0b2037" stroke="#244a68"/>
  <text x="104" y="600" fill="#d6e4f0" font-family="Inter,Arial,sans-serif" font-size="18">Fail closed on missing, stale, malformed, failed, future-dated, or mismatched evidence.</text>
  <text x="1024" y="601" text-anchor="end" fill="#63d8ff" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">Python + Docker Compose</text>
</svg>
